name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag main as, such as v1.2.3
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  tag:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Releases are tagged from main."; exit 1; }
          printf '%s\n' "$VERSION" | grep -Eq '^v[01]\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "$VERSION is not a v0 or v1 version like v1.2.3, the versions this module path can carry."; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then echo "$VERSION is already released."; exit 1; fi
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
